<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheapest Basket</title>
<style>
/* Cheapest Basket — white, light, and deliberately plain: the numbers are the
   interesting part, so almost nothing else is coloured. Green means money. */

:root {
  --bg: #ffffff;
  --bg-soft: #f6f7f9;
  --ink: #1c2430;
  --ink-soft: #5b6675;
  --ink-faint: #99a2ae;
  --line: #e8eaee;
  --line-strong: #d5d9e0;
  --accent: #15a34a;
  --accent-soft: #eefbf2;
  --warn: #d9480f;
  --warn-soft: #fff4ed;
  --radius: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181e;
    --bg-soft: #1b2029;
    --ink: #e9ecf1;
    --ink-soft: #a3acba;
    --ink-faint: #737d8b;
    --line: #29303a;
    --line-strong: #39414d;
    --accent: #3ecf7d;
    --accent-soft: #122a1c;
    --warn: #ff8b5e;
    --warn-soft: #2c1a10;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  padding-inline: 20px;
  padding-block: 22px 64px;
}

.app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.loading { padding: 60px; text-align: center; color: var(--ink-faint); }
.muted { color: var(--ink-faint); font-weight: 500; }

h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 13px; font-weight: 700; margin: 0; color: var(--ink-faint);
     text-transform: uppercase; letter-spacing: .05em; }

/* ------------------------------------------------------------------ topbar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand {
  background: none; border: none; padding: 0; cursor: pointer;
  font: inherit; font-size: 17px; font-weight: 800; color: var(--ink); letter-spacing: -.01em;
}
.chip-btn {
  background: var(--bg-soft); border: 1px solid var(--line-strong); color: var(--ink-soft);
  border-radius: 999px; padding: 6px 13px; font: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip-btn:hover, .chip-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ----------------------------------------------------------------- banners */
.banner {
  margin: 0; border-radius: var(--radius); padding: 10px 14px; font-size: 13px; font-weight: 600;
  background: var(--warn-soft); border: 1px solid var(--warn); color: var(--warn);
}
.banner.info { background: var(--bg-soft); border-color: var(--line-strong); color: var(--ink-soft); font-weight: 500; }
.banner code, .hint code { font-size: 12px; }

.hint { margin: 0; font-size: 13px; color: var(--ink-faint); }

/* ---------------------------------------------------------------- settings */
.settings {
  background: var(--bg-soft); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.settings-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.settings-row .grow { flex: 1; min-width: 190px; }
.settings-row input { flex: 1; min-width: 150px; }

label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--ink-faint); }

/* ------------------------------------------------------------------ inputs */
input {
  font: inherit; font-size: 14px; padding: 8px 11px; width: 100%;
  border: 1px solid var(--line-strong); border-radius: 9px;
  color: var(--ink); background: var(--bg);
}
input::placeholder { color: var(--ink-faint); }
input:focus-visible, button:focus-visible {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}

/* ----------------------------------------------------------------- buttons */
button { font: inherit; font-weight: 600; cursor: pointer; transition: filter .15s ease, background .15s ease; }
button:disabled { cursor: default; opacity: .5; }

.btn-primary {
  background: var(--accent); color: #fff; border: 1px solid transparent;
  border-radius: 9px; padding: 8px 14px; font-size: 13.5px; white-space: nowrap;
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }

.btn-ghost {
  background: var(--bg); color: var(--ink-soft); border: 1px solid var(--line-strong);
  border-radius: 9px; padding: 8px 14px; font-size: 13.5px; white-space: nowrap;
}
.btn-ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-faint); }

.btn-icon {
  width: 30px; height: 30px; flex-shrink: 0; padding: 0; font-size: 16px; line-height: 1;
  background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--ink-faint);
  display: inline-flex; align-items: center; justify-content: center;
}
.btn-icon:hover { color: var(--warn); background: var(--warn-soft); }
.btn-icon.tiny { width: 20px; height: 20px; font-size: 13px; }
.btn-icon.add-btn { border-color: var(--line-strong); color: var(--accent); font-size: 18px; }
.btn-icon.add-btn:hover { background: var(--accent-soft); color: var(--accent); }

/* ------------------------------------------------------------- meals list */
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.new-meal { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.new-meal input { flex: 1; min-width: 170px; }

.meal-cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.meal-cards li { display: flex; align-items: center; gap: 4px; }
.meal-card {
  flex: 1; text-align: left; background: var(--bg); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px;
  display: flex; flex-direction: column; gap: 2px;
}
.meal-card:hover { border-color: var(--accent); background: var(--accent-soft); }
.meal-card-name { font-size: 15.5px; font-weight: 700; color: var(--ink); }
.meal-card-sub { font-size: 12.5px; color: var(--ink-faint); font-weight: 500; }

/* ----------------------------------------------------------- meal detail */
.detail { display: flex; flex-direction: column; gap: 20px; }
.detail-head { display: flex; }
.back { padding: 5px 11px; font-size: 13px; }

.meal-title {
  font-size: 22px; font-weight: 700; letter-spacing: -.01em; padding: 6px 10px;
  border: 1px solid transparent; background: transparent; border-radius: 9px;
}
.meal-title:hover { border-color: var(--line); }

.block { display: flex; flex-direction: column; gap: 10px; }
.block-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.ingredient-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ingredient-row { display: grid; grid-template-columns: 1fr 70px 72px 30px; gap: 6px; align-items: center; }
.ingredient-row.add { margin-top: 2px; }

/* ---------------------------------------------------------------- views */
.view-tabs { display: flex; gap: 4px; background: var(--bg-soft); padding: 4px; border-radius: 10px; }
.view-tab {
  flex: 1; padding: 7px 6px; border: none; background: transparent; border-radius: 7px;
  font-size: 12.5px; font-weight: 700; color: var(--ink-faint); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.view-tab:hover { color: var(--ink); }
.view-tab.active { background: var(--bg); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.07); }

.view { display: flex; flex-direction: column; gap: 12px; }

.price-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.price-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 2px; border-bottom: 1px solid var(--line);
}
.price-row:last-child { border-bottom: none; }
.price-row-item { flex: 1; min-width: 0; font-weight: 600; display: flex; flex-direction: column; }
.price-row-item .muted { font-size: 12px; }
.price-row-where { flex-shrink: 0; font-size: 13px; }
.price-row-price { flex-shrink: 0; min-width: 96px; text-align: right; }
.price-row-price.wide { min-width: 130px; }

.view-total {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  border-top: 2px dashed var(--line-strong); padding-top: 12px;
  font-size: 13px; color: var(--ink-soft); font-weight: 600;
}
.view-total > span { flex: 1; min-width: 0; }
.view-total strong {
  flex-shrink: 0; text-align: right; white-space: nowrap;
  font-size: 18px; color: var(--accent); font-variant-numeric: tabular-nums;
}

.market-name { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

/* --------------------------------------------------------------- prices */
.price-cell { display: inline-flex; align-items: center; gap: 5px; justify-content: flex-end; }
.price-value {
  background: none; border: none; padding: 0; font: inherit; font-weight: 700;
  color: var(--ink); font-variant-numeric: tabular-nums;
  border-bottom: 1px dashed var(--line-strong);
}
.price-value:hover { color: var(--accent); border-bottom-color: var(--accent); }
.price-empty {
  background: none; border: none; padding: 0; font: inherit; font-size: 12.5px;
  color: var(--ink-faint); text-decoration: underline dotted;
}
.price-empty:hover { color: var(--accent); }
.price-input { width: 84px; text-align: right; padding: 5px 8px; }

.tag {
  font-size: 9px; letter-spacing: .04em; text-transform: uppercase; font-weight: 800;
  padding: 2px 5px; border-radius: 5px;
}
.tag.ai { background: var(--accent-soft); color: var(--accent); }
.tag.manual { background: var(--bg-soft); color: var(--ink-faint); }

.price-pending { color: var(--ink-faint); font-style: italic; animation: pulse 1.2s ease-in-out infinite; }
.price-error { display: block; color: var(--warn); font-size: 10.5px; line-height: 1.3; max-width: 110px; }
.ask-ai {
  display: block; background: none; border: none; padding: 2px 0 0;
  font-size: 11px; font-weight: 700; color: var(--accent);
}
.ask-ai:hover { text-decoration: underline; }
@keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

/* ---------------------------------------------------------------- table */
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; min-width: 460px; }
thead th {
  background: var(--bg-soft); font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  font-weight: 800; color: var(--ink-soft); text-align: right; white-space: nowrap;
  padding: 10px 12px; border-bottom: 1px solid var(--line-strong);
}
thead th:first-child { text-align: left; }
.market-col { display: inline-flex; align-items: center; gap: 5px; }
tbody td {
  padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: right;
  font-variant-numeric: tabular-nums; vertical-align: middle;
}
tbody td:first-child { text-align: left; font-weight: 600; }
tbody td:first-child .muted { display: block; font-size: 12px; }
tbody tr:last-child td { border-bottom: none; }
tfoot td {
  padding: 12px; text-align: right; font-weight: 800; font-variant-numeric: tabular-nums;
  border-top: 2px solid var(--line-strong);
}
tfoot td:first-child { text-align: left; font-size: 12px; text-transform: uppercase;
                       letter-spacing: .04em; color: var(--ink-faint); }
tfoot td.best { color: var(--accent); }
tfoot .muted { display: block; font-size: 10.5px; font-weight: 600; }
.crown { font-size: 12px; }

/* --------------------------------------------------------- best market */
.winner {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--accent-soft); border: 1px solid var(--accent);
  border-radius: var(--radius); padding: 14px 16px;
}
.winner-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase;
                letter-spacing: .04em; color: var(--accent); width: 100%; }
.winner-name { font-size: 16px; font-weight: 700; flex: 1; }
.winner-total { font-size: 22px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

.runners { display: flex; flex-direction: column; gap: 6px; }
.runners-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase;
                 letter-spacing: .04em; color: var(--ink-faint); }
.runners ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.runners li { display: flex; justify-content: space-between; align-items: center; gap: 10px;
              font-size: 13.5px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.runners li:last-child { border-bottom: none; }
.runners li > span:last-child { display: inline-flex; align-items: baseline; gap: 7px;
                                font-weight: 700; font-variant-numeric: tabular-nums; }
.runners .muted { font-size: 11.5px; font-weight: 600; }

/* ---------------------------------------------------------------- misc */
.chips { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; background: var(--bg);
  border: 1px solid var(--line-strong); border-radius: 999px;
  padding: 5px 6px 5px 11px; font-size: 13px; font-weight: 600;
}
.empty-state { color: var(--ink-faint); font-size: 14px; margin: 0; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

@media (max-width: 520px) {
  .ingredient-row { grid-template-columns: 1fr 56px 58px 28px; }
  .price-row { flex-wrap: wrap; gap: 6px; }
  .price-row-item { flex-basis: 100%; }
  .price-row-where { flex: 1; }
  /* Let the tab labels wrap onto two lines rather than truncating to "Cheapest…" */
  .view-tab { font-size: 11.5px; white-space: normal; text-overflow: clip; line-height: 1.25; }
  .view-total strong .muted { display: block; }
  thead th, tbody td, tfoot td { padding: 8px 9px; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function () {
  'use strict';

  /* ==========================================================================
     YOUR AI GOES HERE
     --------------------------------------------------------------------------
     This single file has no server, so there is nowhere safe to keep an API
     key: anything you paste below is visible to anyone who opens the file.
     That's fine on your own machine. Do NOT put a real key here and then put
     this file on the internet — the deployed React version has api/ for that.

     Flip `configured` to true once the two functions really call your API.
     ========================================================================== */
  var AI = {
    configured: false,

    /* Should resolve to { price: <number>, note: "<short string>" } */
    estimatePrice: function (ingredient, market, meal, location) {
      return Promise.reject(new Error('AI not set up'));

      // -------- WORKING EXAMPLE (Anthropic) — delete the line above first ----
      // var qty = [ingredient.qty, ingredient.unit].filter(Boolean).join(' ');
      // var prompt =
      //   'You estimate grocery prices in ' + (location || 'Istanbul, Turkey') + '.\n' +
      //   'Market chain: ' + market.name + '\n' +
      //   'Item: ' + ingredient.name + '\n' +
      //   'Quantity needed: ' + (qty || 'not specified') + '\n' +
      //   'Reply with ONLY JSON: {"price": <number>, "note": "<one short sentence>"}';
      //
      // return fetch('https://api.anthropic.com/v1/messages', {
      //   method: 'POST',
      //   headers: {
      //     'content-type': 'application/json',
      //     'x-api-key': 'PASTE_YOUR_KEY_HERE',
      //     'anthropic-version': '2023-06-01',
      //     'anthropic-dangerous-direct-browser-access': 'true'
      //   },
      //   body: JSON.stringify({
      //     model: 'claude-sonnet-4-5',
      //     max_tokens: 200,
      //     messages: [{ role: 'user', content: prompt }]
      //   })
      // }).then(function (r) { return r.json(); }).then(function (data) {
      //   var text = (data.content && data.content[0] && data.content[0].text) || '';
      //   var parsed = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
      //   return { price: Number(parsed.price), note: parsed.note || null };
      // });
    },

    /* Should resolve to an array of market names, e.g. ["BİM", "A101"] */
    findMarkets: function (location) {
      return Promise.reject(new Error('AI not set up'));
    }
  };

  /* ======================================================= state + storage */

  var KEY = 'cheapest-basket-v2';
  var SETTINGS_KEY = 'cheapest-basket-settings';

  function uid() {
    return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function seed() {
    return {
      markets: [
        { id: uid(), name: 'BİM', sort_order: 1 },
        { id: uid(), name: 'A101', sort_order: 2 },
        { id: uid(), name: 'Migros', sort_order: 3 }
      ],
      meals: []
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* private mode or corrupt data — start fresh */ }
    return seed();
  }

  function loadSettings() {
    try {
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* ignore */ }
    return { location: '' };
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ markets: db.markets, meals: db.meals }));
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(ui.settings));
    } catch (e) { /* quota or blocked storage: app still works, just won't persist */ }
  }

  var db = load();
  var ui = {
    settings: loadSettings(),
    openMealId: null,
    showSettings: false,
    view: 'best-item',
    addingMeal: false,
    pending: {},
    errors: {},
    status: null
  };

  /* ============================================================== helpers */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function money(value) {
    var n = Number(value);
    if (!isFinite(n)) return '—';
    return n.toLocaleString('tr-TR', {
      minimumFractionDigits: n % 1 === 0 ? 0 : 2,
      maximumFractionDigits: 2
    }) + ' ₺';
  }

  var PALETTE = ['#3B82F6', '#A855F7', '#EC4899', '#F59E0B', '#14B8A6', '#6366F1', '#84CC16', '#0EA5E9'];

  function colorFor(id) {
    var hash = 0;
    for (var i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) >>> 0;
    return PALETTE[hash % PALETTE.length];
  }

  function cellKey(marketId, ingId) { return marketId + ':' + ingId; }
  function qtyLabel(ing) { return [ing.qty, ing.unit].filter(Boolean).join(' '); }
  function findMeal(id) { return db.meals.filter(function (m) { return m.id === id; })[0]; }
  function findMarket(id) { return db.markets.filter(function (m) { return m.id === id; })[0]; }

  function marketName(market) {
    return '<span class="market-name"><span class="dot" style="background:' +
      colorFor(market.id) + '"></span>' + esc(market.name) + '</span>';
  }

  /* ================================================================= maths */

  function marketTotals(meal) {
    var totals = {};
    db.markets.forEach(function (m) { totals[m.id] = { sum: 0, filled: 0 }; });
    meal.meal_ingredients.forEach(function (ing) {
      ing.prices.forEach(function (p) {
        if (!totals[p.market_id]) return;
        totals[p.market_id].sum += Number(p.price);
        totals[p.market_id].filled += 1;
      });
    });
    return totals;
  }

  /* Only markets that price EVERY ingredient can win — otherwise a market with
     two cheap items would beat one that actually stocks the whole list. */
  function rankedMarkets(meal) {
    var totals = marketTotals(meal);
    var n = meal.meal_ingredients.length;
    return db.markets
      .filter(function (m) { return n > 0 && totals[m.id].filled === n; })
      .map(function (m) { return { market: m, total: totals[m.id].sum }; })
      .sort(function (a, b) { return a.total - b.total; });
  }

  function bestPerIngredient(meal) {
    return meal.meal_ingredients.map(function (ing) {
      var best = null;
      ing.prices.forEach(function (p) {
        if (!findMarket(p.market_id)) return;
        if (!best || Number(p.price) < Number(best.price)) best = p;
      });
      return { ingredient: ing, price: best, market: best ? findMarket(best.market_id) : null };
    });
  }

  /* ================================================================ writes */

  function upsertPrice(ingId, marketId, price, source, note) {
    db.meals.forEach(function (meal) {
      meal.meal_ingredients.forEach(function (ing) {
        if (ing.id !== ingId) return;
        var existing = ing.prices.filter(function (p) { return p.market_id === marketId; })[0];
        if (existing) {
          existing.price = price;
          existing.source = source;
          existing.note = note || null;
        } else {
          ing.prices.push({
            id: uid(), market_id: marketId, ingredient_id: ingId,
            price: price, source: source, note: note || null
          });
        }
      });
    });
    delete ui.errors[cellKey(marketId, ingId)];
    persist();
  }

  function removePrice(ingId, priceId) {
    db.meals.forEach(function (meal) {
      meal.meal_ingredients.forEach(function (ing) {
        if (ing.id !== ingId) return;
        ing.prices = ing.prices.filter(function (p) { return p.id !== priceId; });
      });
    });
    persist();
  }

  /* ==================================================================== AI */

  function requestAiPrice(meal, ing, market, force) {
    var key = cellKey(market.id, ing.id);
    if (ui.pending[key]) return Promise.resolve();
    if (!ing.name || !ing.name.trim()) return Promise.resolve();
    var already = ing.prices.some(function (p) { return p.market_id === market.id; });
    if (already && !force) return Promise.resolve();

    ui.pending[key] = true;
    delete ui.errors[key];
    render();

    return Promise.resolve()
      .then(function () { return AI.estimatePrice(ing, market, meal, ui.settings.location); })
      .then(function (result) {
        if (!result || !isFinite(Number(result.price))) throw new Error('No price returned');
        upsertPrice(ing.id, market.id, Number(result.price), 'ai', result.note);
      })
      .catch(function (err) { ui.errors[key] = err.message || 'Failed'; })
      .then(function () { delete ui.pending[key]; render(); });
  }

  /* A few at a time, so ten ingredients don't fire forty requests at once. */
  function runPool(tasks, limit) {
    limit = limit || 4;
    var queue = tasks.slice();
    function worker() {
      if (!queue.length) return Promise.resolve();
      return queue.shift()().then(worker);
    }
    var workers = [];
    for (var i = 0; i < Math.min(limit, queue.length); i++) workers.push(worker());
    return Promise.all(workers);
  }

  function fetchAllPrices(meal) {
    var tasks = [];
    meal.meal_ingredients.forEach(function (ing) {
      if (!ing.name || !ing.name.trim()) return;
      db.markets.forEach(function (market) {
        if (ing.prices.some(function (p) { return p.market_id === market.id; })) return;
        tasks.push(function () { return requestAiPrice(meal, ing, market); });
      });
    });
    return runPool(tasks);
  }

  /* ================================================================ render */

  function priceCellHtml(ingId, marketId, price) {
    var key = cellKey(marketId, ingId);
    if (ui.pending[key]) return '<span class="price-pending">…</span>';

    if (!price) {
      return '<button type="button" class="price-empty" data-act="edit-price" ' +
        'data-ing="' + ingId + '" data-market="' + marketId + '">add price</button>';
    }

    return '<span class="price-cell">' +
      '<button type="button" class="price-value" title="Click to edit" data-act="edit-price" ' +
        'data-ing="' + ingId + '" data-market="' + marketId + '">' + money(price.price) + '</button>' +
      '<span class="tag ' + (price.source === 'ai' ? 'ai' : 'manual') + '"' +
        (price.note ? ' title="' + esc(price.note) + '"' : '') + '>' +
        (price.source === 'ai' ? 'AI' : 'you') + '</span>' +
      '<button type="button" class="btn-icon tiny" title="Remove price" data-act="remove-price" ' +
        'data-ing="' + ingId + '" data-price="' + price.id + '">×</button>' +
    '</span>';
  }

  function viewBestPerItem(meal) {
    var rows = bestPerIngredient(meal);
    var priced = rows.filter(function (r) { return r.price; });
    var sum = priced.reduce(function (acc, r) { return acc + Number(r.price.price); }, 0);
    var missing = rows.length - priced.length;

    var list = rows.map(function (r) {
      var fallbackMarket = r.market || db.markets[0];
      return '<li class="price-row">' +
        '<span class="price-row-item">' + esc(r.ingredient.name || '(unnamed)') +
          '<span class="muted">' + esc(qtyLabel(r.ingredient)) + '</span></span>' +
        '<span class="price-row-where">' +
          (r.market ? marketName(r.market) : '<span class="muted">—</span>') + '</span>' +
        '<span class="price-row-price">' +
          priceCellHtml(r.ingredient.id, fallbackMarket ? fallbackMarket.id : '', r.price) +
        '</span>' +
      '</li>';
    }).join('');

    return '<div class="view"><ul class="price-rows">' + list + '</ul>' +
      '<div class="view-total"><span>Total, buying each item wherever it&rsquo;s cheapest</span>' +
      '<strong>' + (priced.length ? money(sum) : '—') +
      (missing ? '<span class="muted"> · ' + missing + ' unpriced</span>' : '') +
      '</strong></div></div>';
  }

  function viewAllMarkets(meal) {
    var totals = marketTotals(meal);
    var ranked = rankedMarkets(meal);
    var cheapestId = ranked.length ? ranked[0].market.id : null;
    var n = meal.meal_ingredients.length;

    var head = '<tr><th>Ingredient</th>' + db.markets.map(function (m) {
      return '<th><span class="market-col">' + marketName(m) +
        (m.id === cheapestId ? '<span class="crown">👑</span>' : '') + '</span></th>';
    }).join('') + '</tr>';

    var body = meal.meal_ingredients.map(function (ing) {
      return '<tr><td>' + esc(ing.name || '(unnamed)') +
        '<span class="muted">' + esc(qtyLabel(ing)) + '</span></td>' +
        db.markets.map(function (m) {
          var price = ing.prices.filter(function (p) { return p.market_id === m.id; })[0];
          var key = cellKey(m.id, ing.id);
          var cell = priceCellHtml(ing.id, m.id, price);
          if (!price && AI.configured && !ui.pending[key]) {
            cell += '<button type="button" class="ask-ai" data-act="ask-ai" ' +
              'data-ing="' + ing.id + '" data-market="' + m.id + '">ask AI</button>';
          }
          if (ui.errors[key]) cell += '<span class="price-error">' + esc(ui.errors[key]) + '</span>';
          return '<td>' + cell + '</td>';
        }).join('') + '</tr>';
    }).join('');

    var foot = '<tr><td>Total</td>' + db.markets.map(function (m) {
      var t = totals[m.id];
      return '<td' + (m.id === cheapestId ? ' class="best"' : '') + '>' +
        (t.filled ? money(t.sum) : '—') +
        (t.filled < n ? '<span class="muted">' + (n - t.filled) + ' missing</span>' : '') +
      '</td>';
    }).join('') + '</tr>';

    return '<div class="view"><div class="table-scroll"><table>' +
      '<thead>' + head + '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot>' +
      '</table></div></div>';
  }

  function viewBestMarket(meal) {
    var ranked = rankedMarkets(meal);
    if (!ranked.length) {
      return '<div class="view"><p class="empty-state">No market has a price for every ' +
        'ingredient yet — press <strong>Find prices</strong>, or fill the gaps in the ' +
        '&ldquo;Every market&rdquo; view.</p></div>';
    }

    var winner = ranked[0];
    var rest = ranked.slice(1);

    var list = meal.meal_ingredients.map(function (ing) {
      var price = ing.prices.filter(function (p) { return p.market_id === winner.market.id; })[0];
      return '<li class="price-row">' +
        '<span class="price-row-item">' + esc(ing.name || '(unnamed)') +
          '<span class="muted">' + esc(qtyLabel(ing)) + '</span></span>' +
        '<span class="price-row-price wide">' +
          priceCellHtml(ing.id, winner.market.id, price) + '</span>' +
      '</li>';
    }).join('');

    var runners = rest.length ? '<div class="runners">' +
      '<span class="runners-label">Same basket elsewhere</span><ul>' +
      rest.map(function (r) {
        return '<li>' + marketName(r.market) + '<span>' + money(r.total) +
          '<span class="muted">+' + money(r.total - winner.total) + '</span></span></li>';
      }).join('') + '</ul></div>' : '';

    return '<div class="view">' +
      '<div class="winner"><span class="winner-label">Cheapest place to buy everything</span>' +
      '<span class="winner-name">' + marketName(winner.market) + '</span>' +
      '<strong class="winner-total">' + money(winner.total) + '</strong></div>' +
      '<ul class="price-rows">' + list + '</ul>' + runners + '</div>';
  }

  function renderSettings() {
    if (!ui.showSettings) return '';

    var chips = db.markets.map(function (m) {
      return '<span class="chip"><span class="dot" style="background:' + colorFor(m.id) + '"></span>' +
        esc(m.name) + '<button type="button" class="btn-icon tiny" data-act="del-market" ' +
        'data-market="' + m.id + '" title="Remove">×</button></span>';
    }).join('');

    return '<div class="settings">' +
      '<div class="settings-row">' +
        '<label class="grow">Where you shop' +
          '<input type="text" id="loc-input" placeholder="e.g. Kadıköy, Istanbul" value="' +
            esc(ui.settings.location) + '"></label>' +
        '<button type="button" class="btn-ghost" data-act="geo">Use my location</button>' +
        '<button type="button" class="btn-primary" data-act="find-markets"' +
          (AI.configured ? '' : ' disabled') + '>Find markets</button>' +
      '</div>' +
      (ui.status ? '<p class="hint">' + esc(ui.status) + '</p>' : '') +
      '<div class="chips">' + (chips || '<span class="muted">No markets yet.</span>') + '</div>' +
      '<form class="settings-row" data-act="add-market-form">' +
        '<input type="text" id="new-market" placeholder="Or add a market by hand">' +
        '<button type="submit" class="btn-ghost">Add</button>' +
      '</form>' +
    '</div>';
  }

  function renderMealsList() {
    var adding = ui.addingMeal ?
      '<form class="new-meal" data-act="new-meal-form">' +
        '<input type="text" id="new-meal-name" placeholder="Meal name, e.g. Butter chicken">' +
        '<button type="submit" class="btn-primary">Add</button>' +
        '<button type="button" class="btn-ghost" data-act="cancel-meal">Cancel</button>' +
      '</form>' : '';

    var cards = db.meals.map(function (meal) {
      var count = meal.meal_ingredients.length;
      var sub;
      if (!count) {
        sub = 'No ingredients yet';
      } else {
        var ranked = rankedMarkets(meal);
        var items = count + ' ingredient' + (count === 1 ? '' : 's');
        sub = ranked.length
          ? items + ' · ' + money(ranked[0].total) + ' at ' + ranked[0].market.name
          : items + ' · no prices yet';
      }
      return '<li>' +
        '<button type="button" class="meal-card" data-act="open-meal" data-meal="' + meal.id + '">' +
          '<span class="meal-card-name">' + esc(meal.name || 'Untitled meal') + '</span>' +
          '<span class="meal-card-sub">' + esc(sub) + '</span>' +
        '</button>' +
        '<button type="button" class="btn-icon" title="Delete" data-act="del-meal" ' +
          'data-meal="' + meal.id + '">×</button>' +
      '</li>';
    }).join('');

    var empty = (!db.meals.length && !ui.addingMeal)
      ? '<p class="empty-state">No meals yet. Add one, list what goes into it, and we&rsquo;ll price it up.</p>'
      : '';

    return '<section><div class="section-head"><h1>Your meals</h1>' +
      (ui.addingMeal ? '' : '<button type="button" class="btn-primary" data-act="add-meal">+ New meal</button>') +
      '</div>' + adding + empty + '<ul class="meal-cards">' + cards + '</ul></section>';
  }

  function renderMealDetail(meal) {
    var hasIngredients = meal.meal_ingredients.length > 0;
    var busy = Object.keys(ui.pending).length > 0;

    var rows = meal.meal_ingredients.map(function (ing) {
      return '<li class="ingredient-row">' +
        '<input type="text" value="' + esc(ing.name) + '" placeholder="Ingredient" ' +
          'data-act="ing-field" data-ing="' + ing.id + '" data-field="name">' +
        '<input type="text" value="' + esc(ing.qty == null ? '' : ing.qty) + '" placeholder="Qty" ' +
          'data-act="ing-field" data-ing="' + ing.id + '" data-field="qty">' +
        '<input type="text" value="' + esc(ing.unit || '') + '" placeholder="unit" ' +
          'data-act="ing-field" data-ing="' + ing.id + '" data-field="unit">' +
        '<button type="button" class="btn-icon" title="Remove" data-act="del-ing" ' +
          'data-ing="' + ing.id + '">×</button>' +
      '</li>';
    }).join('');

    var views = [
      { key: 'best-item', label: 'Cheapest per item' },
      { key: 'all', label: 'Every market' },
      { key: 'best-market', label: 'Cheapest market' }
    ];

    var tabs = views.map(function (v) {
      return '<button type="button" class="view-tab' + (ui.view === v.key ? ' active' : '') +
        '" data-act="view" data-view="' + v.key + '">' + v.label + '</button>';
    }).join('');

    var viewHtml = '';
    if (hasIngredients && db.markets.length) {
      if (ui.view === 'best-item') viewHtml = viewBestPerItem(meal);
      else if (ui.view === 'all') viewHtml = viewAllMarkets(meal);
      else viewHtml = viewBestMarket(meal);
      viewHtml = '<div class="view-tabs">' + tabs + '</div>' + viewHtml;
    }

    var hints = '';
    if (!AI.configured) {
      hints += '<p class="hint">AI pricing isn&rsquo;t set up in this file, so prices are yours ' +
        'to type in. Open the file in a text editor and fill in the <code>AI</code> block at the top.</p>';
    }
    if (!db.markets.length) {
      hints += '<p class="hint">Add a market first — open the location chip at the top.</p>';
    }

    return '<section class="detail">' +
      '<div class="detail-head"><button type="button" class="btn-ghost back" data-act="back">← All meals</button></div>' +
      '<input class="meal-title" type="text" value="' + esc(meal.name) + '" placeholder="Meal name" ' +
        'data-act="meal-name" data-meal="' + meal.id + '">' +
      '<div class="block"><h2>Ingredients</h2>' +
        (hasIngredients ? '<ul class="ingredient-rows">' + rows + '</ul>' : '') +
        '<form class="ingredient-row add" data-act="add-ing-form">' +
          '<input type="text" id="ing-name" placeholder="Add an ingredient…">' +
          '<input type="text" id="ing-qty" placeholder="Qty">' +
          '<input type="text" id="ing-unit" placeholder="unit">' +
          '<button type="submit" class="btn-icon add-btn" title="Add">+</button>' +
        '</form>' +
      '</div>' +
      '<div class="block"><div class="block-head"><h2>Prices</h2>' +
        '<button type="button" class="btn-primary" data-act="find-prices"' +
          (!AI.configured || !hasIngredients || !db.markets.length || busy ? ' disabled' : '') + '>' +
          (busy ? 'Finding prices…' : '🔍 Find prices') + '</button></div>' +
        hints + viewHtml +
      '</div>' +
    '</section>';
  }

  function render() {
    var meal = ui.openMealId ? findMeal(ui.openMealId) : null;
    if (ui.openMealId && !meal) ui.openMealId = null;

    var locLabel = ui.settings.location ? '📍 ' + ui.settings.location : '📍 Set location';

    document.getElementById('app').innerHTML =
      '<header class="topbar">' +
        '<button type="button" class="brand" data-act="back" title="All meals">Cheapest Basket</button>' +
        '<button type="button" class="chip-btn' + (ui.showSettings ? ' on' : '') +
          '" data-act="toggle-settings">' + esc(locLabel) + '</button>' +
      '</header>' +
      '<p class="banner info">Saving to this browser only — this single file has no database.</p>' +
      renderSettings() +
      (meal ? renderMealDetail(meal) : renderMealsList());
  }

  /* ================================================================ events */

  var app = document.getElementById('app');

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');

    if (act === 'toggle-settings') {
      ui.showSettings = !ui.showSettings;
      ui.status = null;
      render();
    } else if (act === 'back') {
      ui.openMealId = null;
      render();
    } else if (act === 'add-meal') {
      ui.addingMeal = true;
      render();
      var f = document.getElementById('new-meal-name');
      if (f) f.focus();
    } else if (act === 'cancel-meal') {
      ui.addingMeal = false;
      render();
    } else if (act === 'open-meal') {
      ui.openMealId = el.getAttribute('data-meal');
      ui.view = 'best-item';
      render();
    } else if (act === 'del-meal') {
      var mId = el.getAttribute('data-meal');
      var target = findMeal(mId);
      if (window.confirm('Delete "' + (target ? target.name : '') + '" and its prices?')) {
        db.meals = db.meals.filter(function (m) { return m.id !== mId; });
        persist();
        render();
      }
    } else if (act === 'del-ing') {
      var ingId = el.getAttribute('data-ing');
      var cur = findMeal(ui.openMealId);
      cur.meal_ingredients = cur.meal_ingredients.filter(function (i) { return i.id !== ingId; });
      persist();
      render();
    } else if (act === 'del-market') {
      var mkId = el.getAttribute('data-market');
      db.markets = db.markets.filter(function (m) { return m.id !== mkId; });
      db.meals.forEach(function (meal) {
        meal.meal_ingredients.forEach(function (ing) {
          ing.prices = ing.prices.filter(function (p) { return p.market_id !== mkId; });
        });
      });
      persist();
      render();
    } else if (act === 'view') {
      ui.view = el.getAttribute('data-view');
      render();
    } else if (act === 'edit-price') {
      startEditingPrice(el);
    } else if (act === 'remove-price') {
      removePrice(el.getAttribute('data-ing'), el.getAttribute('data-price'));
      render();
    } else if (act === 'ask-ai') {
      var m2 = findMeal(ui.openMealId);
      var ing2 = m2.meal_ingredients.filter(function (i) { return i.id === el.getAttribute('data-ing'); })[0];
      requestAiPrice(m2, ing2, findMarket(el.getAttribute('data-market')), true);
    } else if (act === 'find-prices') {
      fetchAllPrices(findMeal(ui.openMealId));
    } else if (act === 'geo') {
      useMyLocation();
    } else if (act === 'find-markets') {
      doFindMarkets();
    }
  });

  app.addEventListener('submit', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    e.preventDefault();
    var act = el.getAttribute('data-act');

    if (act === 'new-meal-form') {
      var name = document.getElementById('new-meal-name').value.trim();
      if (!name) return;
      var meal = { id: uid(), name: name, budget: null, meal_ingredients: [] };
      db.meals.push(meal);
      ui.addingMeal = false;
      ui.openMealId = meal.id;
      persist();
      render();
    } else if (act === 'add-ing-form') {
      var iname = document.getElementById('ing-name').value.trim();
      if (!iname) return;
      var qtyRaw = document.getElementById('ing-qty').value.trim();
      var cur = findMeal(ui.openMealId);
      cur.meal_ingredients.push({
        id: uid(),
        name: iname,
        qty: qtyRaw === '' ? null : Number(qtyRaw),
        unit: document.getElementById('ing-unit').value.trim() || null,
        prices: []
      });
      persist();
      render();
      var next = document.getElementById('ing-name');
      if (next) next.focus();
    } else if (act === 'add-market-form') {
      var mname = document.getElementById('new-market').value.trim();
      if (!mname) return;
      var order = db.markets.length
        ? Math.max.apply(null, db.markets.map(function (m) { return m.sort_order; })) + 1 : 1;
      db.markets.push({ id: uid(), name: mname, sort_order: order });
      persist();
      render();
    }
  });

  /* Field edits save on blur, so typing never triggers a re-render mid-word. */
  app.addEventListener('blur', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');

    if (act === 'meal-name') {
      var meal = findMeal(el.getAttribute('data-meal'));
      if (meal) { meal.name = el.value; persist(); }
    } else if (act === 'ing-field') {
      var cur = findMeal(ui.openMealId);
      if (!cur) return;
      var ing = cur.meal_ingredients.filter(function (i) { return i.id === el.getAttribute('data-ing'); })[0];
      if (!ing) return;
      var field = el.getAttribute('data-field');
      ing[field] = field === 'qty' ? (el.value === '' ? null : Number(el.value)) : el.value;
      persist();
      render();
    } else if (act === 'loc-field') {
      ui.settings.location = el.value;
      persist();
    }
  }, true);

  app.addEventListener('input', function (e) {
    if (e.target.id === 'loc-input') {
      ui.settings.location = e.target.value;
      persist();
    }
  });

  /** Swap a price display for an input, in place — no full re-render, so focus
   *  lands where the user clicked. */
  function startEditingPrice(el) {
    var ingId = el.getAttribute('data-ing');
    var marketId = el.getAttribute('data-market');
    if (!marketId) return;

    var holder = el.closest('.price-cell') || el;
    var current = el.classList.contains('price-value') ? el.textContent.replace(/[^\d.,]/g, '').replace(',', '.') : '';

    var input = document.createElement('input');
    input.type = 'number';
    input.className = 'price-input';
    input.step = '0.01';
    input.min = '0';
    input.value = current;

    holder.replaceWith(input);
    input.focus();
    input.select();

    var done = false;
    function commit() {
      if (done) return;
      done = true;
      var value = Number(input.value);
      if (input.value !== '' && isFinite(value)) upsertPrice(ingId, marketId, value, 'manual', null);
      render();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') input.blur();
      if (ev.key === 'Escape') { done = true; render(); }
    });
  }

  function useMyLocation() {
    if (!navigator.geolocation) {
      ui.status = "This browser can't share your location.";
      render();
      return;
    }
    ui.status = 'Locating…';
    render();
    navigator.geolocation.getCurrentPosition(function (pos) {
      ui.settings.location = pos.coords.latitude.toFixed(4) + ', ' + pos.coords.longitude.toFixed(4);
      ui.status = 'Location set from your device.';
      persist();
      render();
    }, function () {
      ui.status = 'Location permission denied — type your area instead.';
      render();
    });
  }

  function doFindMarkets() {
    if (!ui.settings.location.trim()) {
      ui.status = 'Type where you live first.';
      render();
      return;
    }
    ui.status = 'Looking for markets near you…';
    render();
    Promise.resolve()
      .then(function () { return AI.findMarkets(ui.settings.location); })
      .then(function (names) {
        var existing = db.markets.map(function (m) { return m.name.toLowerCase(); });
        var added = 0;
        (names || []).forEach(function (name) {
          if (existing.indexOf(String(name).toLowerCase()) !== -1) return;
          db.markets.push({ id: uid(), name: String(name), sort_order: db.markets.length + 1 });
          added++;
        });
        ui.status = added ? 'Added ' + added + ' market' + (added === 1 ? '' : 's') + '.' : 'No new markets found.';
        persist();
        render();
      })
      .catch(function (err) {
        ui.status = err.message || 'Could not find markets.';
        render();
      });
  }

  render();
})();
</script>
</body>
</html>
